name: Screener
options:
  bundleIdPrefix: com.vestal
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
# Signing team and bundle id come from Config/Screener.xcconfig, which
# optionally includes the git-ignored Local.xcconfig (see Local.xcconfig.example).
configFiles:
  Debug: Config/Screener.xcconfig
  Release: Config/Screener.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    # iPhone + iPad; the iPad app also runs on Apple-silicon Macs
    # ("Designed for iPad", README › Mac).
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  # attaswift/BigInt, vendored (Vendor/BigInt/README.md) so it is optimized
  # even in Debug: the SRP modexps are ~17x slower at -Onone.
  BigInt:
    type: library.static
    platform: iOS
    sources: [Vendor/BigInt/Sources]
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        SWIFT_COMPILATION_MODE: wholemodule
        ENABLE_TESTABILITY: NO
        SWIFT_STRICT_CONCURRENCY: complete
  Screener:
    type: application
    platform: iOS
    sources:
      - Screener
      # Shown by the in-app Acknowledgements sheet (UI/AcknowledgementsView).
      - path: THIRD_PARTY_NOTICES
        buildPhase: resources
    dependencies:
      - target: BigInt
    info:
      path: Screener/Info.plist
      properties:
        CFBundleDisplayName: Screener
        UILaunchScreen:
          UIColorName: LaunchBackground
        # iPhone: every orientation but upside-down (landscape suits a Mac
        # desktop best; SessionView hints at it in portrait).
        UISupportedInterfaceOrientations~iphone:
          [UIInterfaceOrientationPortrait,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Screener connects to Macs on your local network for screen sharing.
        NSBonjourServices: [_rfb._tcp]
        UIApplicationSupportsIndirectInputEvents: true
        # Picture in Picture (Media/PiP): PiP needs the audio background mode.
        # Without PiP the session still closes on backgrounding (LifecyclePolicy).
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SCREENER_BUNDLE_ID)
        # The iPad app is offered on Apple-silicon Macs ("Designed for iPad").
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ScreenerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ScreenerTests]
    resources: [ScreenerTests/Fixtures]
    dependencies:
      - target: Screener
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Screener:
    build:
      targets: {Screener: all, ScreenerTests: [test]}
    test:
      targets: [ScreenerTests]
