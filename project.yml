name: Screener
options:
  bundleIdPrefix: com.vestal
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YOURTEAMID
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "2"
targets:
  # attaswift/BigInt, vendored (Vendor/BigInt/README.md) so it is optimized
  # even in Debug: the SRP modexps are ~17x slower at -Onone.
  BigInt:
    type: library.static
    platform: iOS
    sources: [Vendor/BigInt/Sources]
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        SWIFT_COMPILATION_MODE: wholemodule
        ENABLE_TESTABILITY: NO
        SWIFT_STRICT_CONCURRENCY: complete
  Screener:
    type: application
    platform: iOS
    sources:
      - Screener
      # Shown by the in-app Acknowledgements sheet (UI/AcknowledgementsView).
      - path: THIRD_PARTY_NOTICES
        buildPhase: resources
    dependencies:
      - target: BigInt
    info:
      path: Screener/Info.plist
      properties:
        CFBundleDisplayName: Screener
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Screener connects to Macs on your local network for screen sharing.
        NSBonjourServices: [_rfb._tcp]
        UIApplicationSupportsIndirectInputEvents: true
        # Picture in Picture (Media/PiP): PiP needs the audio background mode.
        # Without PiP the session still closes on backgrounding (LifecyclePolicy).
        UIBackgroundModes: [audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vestal.screener
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ScreenerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ScreenerTests]
    resources: [ScreenerTests/Fixtures]
    dependencies:
      - target: Screener
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Screener:
    build:
      targets: {Screener: all, ScreenerTests: [test]}
    test:
      targets: [ScreenerTests]
